name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend · npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  backend-postgres:
    name: Backend · npm test on Postgres
    runs-on: ubuntu-latest
    # The schema must run on Postgres unchanged except for the provider line (docs/DECISIONS.md #1). This applies the
    # Postgres migration history, fails if it no longer matches the schema, then runs the whole suite there.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quid
          POSTGRES_PASSWORD: quid
          POSTGRES_DB: quid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quid -d quid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QUID_TEST_DATABASE_URL: postgresql://quid:quid@localhost:5432/quid_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Switch to Postgres
        run: |
          sh scripts/use-postgres.sh
          npx prisma generate
      - name: Postgres migrations match the schema
        run: |
          DATABASE_URL="$QUID_TEST_DATABASE_URL" npx prisma migrate deploy
          # Exit code 2 means the schema changed without a matching migration in prisma/migrations-postgres.
          DATABASE_URL="$QUID_TEST_DATABASE_URL" npx prisma migrate diff --from-url "$QUID_TEST_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm test

  ios:
    name: iOS · xcodebuild test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 16
        run: |
          if ls -d /Applications/Xcode_16*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"
          fi
          xcodebuild -version
      - name: Pick an iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | jq -r '
            [ .devices | to_entries[] | select(.key | test("iOS")) | .value[]
              | select(.isAvailable == true) | select(.name | test("^iPhone [0-9]+$")) ]
            | sort_by(.name | ltrimstr("iPhone ") | tonumber) | last | .name // empty')
          if [ -z "$DEVICE" ]; then DEVICE="iPhone 16"; fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project ios/QuidApp.xcodeproj \
            -scheme QuidApp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1
          STATUS=$?
          echo "Passed test cases: $(grep -ciE 'test case .* passed' xcodebuild.log)"
          echo "Failed test cases: $(grep -ciE 'test case .* failed' xcodebuild.log)"
          # A crashing test host makes xcodebuild relaunch it and report the survivors as passed; treat that as red.
          CRASHES=$(grep -ciE 'restarting after unexpected exit|crashed in' xcodebuild.log)
          echo "Test host crashes: $CRASHES"
          grep -iE 'restarting after unexpected exit|crashed in' xcodebuild.log | head -20 || true
          grep -iE "error:|test suite .* (passed|failed)|executed [0-9]+ tests|\*\* TEST" xcodebuild.log || true
          # UI tests print the accessibility hierarchy when an element never appears; surface it in the job log.
          if grep -q "UITEST-HIERARCHY-BEGIN" xcodebuild.log; then
            echo "::group::UI test hierarchy dump"
            sed -n '/UITEST-HIERARCHY-BEGIN/,/UITEST-HIERARCHY-END/p' xcodebuild.log | head -400
            echo "::endgroup::"
          fi
          # The accessibility audit prints one AXAUDIT line per finding.
          if grep -q "AXAUDIT" xcodebuild.log; then
            echo "::group::Accessibility audit findings"
            grep -oE "AXAUDIT.*" xcodebuild.log | sort | uniq | head -400
            echo "::endgroup::"
          fi
          if [ "$STATUS" -eq 0 ] && [ "$CRASHES" -gt 0 ]; then
            echo "::error::A test host crashed; the suites it was running did not complete"
            exit 1
          fi
          exit $STATUS
      - name: Crash reports and simulator log
        if: failure()
        run: |
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -20 || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/QuidApp*.ips 2>/dev/null | head -2); do
            echo "::group::$f"
            head -c 8000 "$f"
            echo
            echo "::endgroup::"
          done
          UDID=$(xcrun simctl list devices booted -j | jq -r '[.devices[][] | select(.state=="Booted")][0].udid // empty')
          if [ -n "$UDID" ]; then
            echo "::group::Simulator log lines for QuidApp (last 20 minutes)"
            xcrun simctl spawn "$UDID" log show --last 20m --style compact \
              --predicate 'process == "QuidApp" OR (process == "SpringBoard" AND eventMessage CONTAINS "QuidApp")' 2>/dev/null \
              | grep -iE "fatal|crash|exception|terminat|watchdog|killed|error" | tail -100 || true
            echo "::endgroup::"
          fi
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
